name: Aegis Growth OS — Daily Autonomous Sweeper & Archival Pipeline

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sweep-and-archive:
    name: LLM Prompt Array Sweep & TimescaleDB Compaction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Compaction Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests locust

      - name: Execute Autonomous AI Engine Citation Sweep
        run: |
          node -e "
            const promptCompiler = require('./backend/services/prompt_compiler');
            promptCompiler.sweepAndComputeCoCitations('site_01', 'comp_01')
              .then(res => console.log('Successfully swept AI engines and recorded', res.length, 'co-citation vectors.'))
              .catch(err => { console.error('Sweep failure:', err.message); process.exit(1); });
          "

      - name: Execute Daily Columnar Compression & Cold Archival Routine
        run: python backend/scripts/archive_pipeline.py
        env:
          DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
          DB_NAME: ${{ secrets.DB_NAME || 'aegis_growth_platform' }}
          DB_USER: ${{ secrets.DB_USER || 'aegis_db_admin' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'mock_pass' }}
          BACKUP_DIR: /tmp/aegis_cold_storage
